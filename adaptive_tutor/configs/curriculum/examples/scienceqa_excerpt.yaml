# Small ScienceQA-style excerpt.
#
# This file is written by hand to demonstrate the multi-subject
# curriculum shape used by the thesis. A real ScienceQA-derived YAML
# will be produced by a separate offline extraction script that obeys
# the constraints in ADR-006 section 2.4 (snake_case ids, dataset-only
# prerequisite inference, 1 to 5 prerequisites per node).
#
# The concepts here are loosely inspired by ScienceQA topics but the
# concrete examples are simple enough that any examiner can follow the
# prerequisite logic without needing the ScienceQA paper.

version: "0.1.0"

concepts:
  - concept_id: cardinal_directions
    name: "Cardinal Directions"
    subject: social_science
    grade: 2
    skills: [map_reading, north_south_east_west]
    instruction: "Maps have four cardinal directions: north, south, east, and west."
    prerequisites: []
    difficulty: 0.12

  - concept_id: continents_and_oceans
    name: "Continents and oceans"
    subject: social_science
    grade: 3
    skills: [identify_continent, identify_ocean]
    instruction: "Earth has seven continents and five oceans."
    prerequisites: [cardinal_directions]
    difficulty: 0.20

  - concept_id: basic_probability
    name: "Basic probability"
    subject: mathematics
    grade: 6
    skills: [event_probability, fraction_as_probability]
    instruction: "Probability of an event is the ratio of favourable to total outcomes."
    prerequisites: []
    difficulty: 0.40

  - concept_id: dominant_recessive_alleles
    name: "Dominant and recessive alleles"
    subject: natural_science
    grade: 7
    skills: [allele_dominance]
    instruction: "Dominant alleles mask recessive alleles in heterozygous genotypes."
    prerequisites: []
    difficulty: 0.55

  - concept_id: genotype_vs_phenotype
    name: "Genotype vs phenotype"
    subject: natural_science
    grade: 7
    skills: [genotype_phenotype_distinction]
    instruction: "Genotype is the allele combination; phenotype is the observable trait."
    prerequisites: [dominant_recessive_alleles]
    difficulty: 0.60

  - concept_id: biology_punnett_square_probability
    name: "Punnett square probability"
    subject: natural_science
    grade: 8
    skills: [punnett_square_construction, punnett_square_inference]
    instruction: "Use a Punnett square to calculate probabilities of offspring genotypes."
    prerequisites:
      - genotype_vs_phenotype
      - dominant_recessive_alleles
      - basic_probability
    difficulty: 0.72

  - concept_id: experimental_design
    name: "Experimental Design"
    subject: natural_science
    grade: 7
    skills: [identify_experimental_question, identify_variables]
    instruction: "Experiments can answer questions by testing variables and measuring outcomes."
    prerequisites: []
    difficulty: 0.50
