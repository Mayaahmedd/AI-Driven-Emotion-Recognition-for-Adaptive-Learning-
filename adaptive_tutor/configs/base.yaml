# adaptive_tutor / configs / base.yaml
#
# Defaults aligned with **implemented** thesis-phase code (Phases 0–6).
# See ADR-006 for scope; keys here are not loaded by a central Hydra schema yet —
# the demo runner and unit tests use explicit Python APIs.

# ----- Run identity ----------------------------------------------------------
experiment_name: "exp_dev"
seed: 0
device: "auto"
log_dir: "runs"
wandb:
  enabled: false
  project: "adaptive-tutor"
  entity: null
  tags: []

# ----- Environment / curriculum / FER (documentation + future trainer) -------
env:
  max_episode_steps: 200
  fer:
    consume_raw_vector: true
    rolling_window:
      length: 8
      summary: ["mean", "slope"]
  curriculum:
    provider: "teacher"
    granularity: "topic"
    static: true
# Phase-8+ trainer may read these; :class:`TutoringEnvironment` uses constructor args today.
# env.simulator:
#   cohort_size: 64

# ----- Reward ---------------------------------------------------------------
# Implemented as :class:`adaptive_tutor.rewards.RewardEngine` (single scalar formula).
# YAML block kept for documentation only until a config loader wires coefficients.
rewards:
  note: "see adaptive_tutor.rewards.RewardEngine bachelor-thesis defaults"

# ----- Agents (skeleton for future DQN / PPO only) --------------------------
agents:
  dqn:
    gamma: 0.99
    target_tau: 0.005
    network:
      hidden: [256, 256]
      dueling: true
  ppo:
    gamma: 0.99
    lambda_gae: 0.95
    clip_eps: 0.2
    entropy_coef: 0.01
    value_clip: 0.2
    rollout_steps_macro: 256

# ----- Safety / action mask (Phase 7 — not wired in runtime yet) ----------
safety:
  cooldown_steps:
    encouragement: 5
    break: 20
    reflection: 10
  max_interventions_per_episode: 12

# ----- Logging cadence -------------------------------------------------------
logging:
  every_n_steps: 50
  trace_jsonl: true
  tensorboard: true
  console_summary_every_n_episodes: 5

# ----- Checkpointing ---------------------------------------------------------
checkpointing:
  every_n_steps: 5000
  keep_last: 3
  save_best_on: "eval/learning_gain_norm"
